<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>User Info</legend>
            <label>User Id:</label>
            <input type="number" id="uid" name="uid" tabindex="3"><br><br>
            <label>User name:</label>
            <input type="text" id="uname" name="uname" tabindex="1"><br><br>
            <label>Password:</label>
            <input type="password" id="pwd" name="pwd" tabindex="4"><br><br>
            <label>Conform Password:</label>
            <input type="password" id="cpwd" name="cpwd" tabindex="2"><br><br>
            <label>Mobile Number:</label>
            <input type="tel" for="mobile" name="mobile"><br><br>
            <label for="gen">Gender </label>
            Female:<input type="radio" id="gen" name="gen" value="female">
            Male:<input type="radio" id="gen" name="gen" value="Male"><br><br>
        </fieldset>
        
        <fieldset >
            <legend>Education</legend>
                 <label for="skill">Skill Set</label>
                Java<input type="checkbox" id="skill" name="skill" value="java">
                 Python<input type="checkbox" id="skill" name="skill" value="python">
                 Spring<input type="checkbox" id="skill" name="skill" value="Spring">
                 HTML,CSS<input type="checkbox" id="skill" name="skill" value="HTML,CSS">
                 <br><br>
                <label for="qual">Qualification</label>
                 <select id="qual">
                 <option value="M.Tech">M.Tech</option>
                 <option value="MBA">MBA</option>
                 <option value="B.Tech">B.Tech</option>
                 <option value="MCA">MCA</option>
             </select>
        </fieldset>
    </form>
    
</body>
</html>
