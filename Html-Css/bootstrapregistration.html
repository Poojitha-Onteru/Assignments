<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container-sm" style="width: 500px;">
        <div>
            <h1  class="text-center text-capitalize bg-success">Demo form</h1>
        </div>
        <form class="bg-info">
            <div class="row">
                <label for="name" class="col-3 form-label ">Name</label>
                <div class="col-9"><input type="text" class=" form-control" id="name" placeholder="Enter Name "></div>
            </div>
            <div class="row mt-3">
                <label for="Age" class="col-3 form-label">Age</label>
                <dic class="col-9"><input type="number" class="form-control" id="Age" placeholder="Enter Age"></dic>
            </div>
            <div class="mt-3 col-12">
                <select name="opt" id="opt" class="form-select">
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="Html">Html</option>
                    <option value="Spring">Spring</option>
                </select>
            </div>
            <div class="row">
                <label for="chk" class="col-3">Check</label>
                <div class="col-9">
                    <div class=" form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" value="Male">
                        <label> Male</label>
                     </div>
                     <div class=" form-check form-check-inline">
                         <input class="form-check-input" type="checkbox" value="Female">
                         <label for="chk">Female</label>
                     </div>
                     <div class=" form-check form-check-inline"></div>
                         <input class="form-check-input" type="checkbox" value="Other">
                         <label>Other</label>
                     </div>
                </div>
                <div class="row">
                    <label for="items" class="col-3">Items List</label>
                    <div class="col-9">
                        <ul class="list-group">
                            <li class="list-group-item list-group-item-info">item1</li>
                            <li class="list-group-item list-group-item-warning">item2</li>
                            <li class="list-group-item list-group-item-success">item3</li>
                            <li class="nav-item dropdown"> 
                                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false"> More </a> 
                                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                     <li><a class="dropdown-item" href="#">Action</a></li> 
                                     <li><a class="dropdown-item" href="#">Another action</a></li> 
                                     <li><hr class="dropdown-divider"></li> 
                                     <li><a class="dropdown-item" href="#">Something else here</a></li>
                                </ul> 
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
            
        </form>

    </div>
</body>
</html>
