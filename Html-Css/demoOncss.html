<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First CSS</title>
    <style>
        h1{
            text-shadow: 2px 2px 10px rgb(4, 207, 243);
        }
        .box{
            width: 50%;
            height: 50%;
            box-shadow: 5px 5px 15px green;
            background: conic-gradient(rgb(216, 55, 176),rgb(48, 151, 57),rgb(160, 163, 12));
        }
        .lgrd{
            background: linear-gradient(to bottom,rgb(140, 140, 212),rgb(201, 14, 176),rgb(11, 197, 230));
        }
        .rgrd{
            background: radial-gradient(circle closest-corner,rgb(53, 53, 109),rgb(221, 26, 205),rgb(7, 212, 219));
        }
        .cgrd{
            background: conic-gradient(rgb(140, 140, 212),rgb(48, 151, 57),rgb(160, 163, 12));
        }

    </style>
</head>
<body >
   <h1 class="box">Shadowing in CSS</h1>
</body>
</html>
