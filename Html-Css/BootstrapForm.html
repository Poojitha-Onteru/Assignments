<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .dotted-border{
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <div class="container mt-5  dotted-border border-primary" style="width: 325px;height: auto;">
        <h2 class="text-center">Login Form</h2>
        <form >
            <div class="mb-3">
                <label class="form-label" for="uname">User Name</label>
                <input class="form-control" type="text" id="uname" placeholder="Username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="pwd">Password</label>
                <input class="form-control" type="text" id="pwd" placeholder="Password">
            </div>
           <div class="mb-3 text-center">
                <button class="btn btn-primary" onclick="login()">Submit</button>
                <button type="reset" class="btn btn-danger active" aria-current="page">Reset</button>
           </div>
        </form>
    </div>

    <script>
        // function login(){

        // }

        const login=()=>{
            event.preventDefault();
            let uname=document.getElementById("uname").value;
            let pwd=document.getElementById("pwd").value;
            console.log("UserName: "+uname+" password: "+pwd)
            if(uname==="poojitha" && pwd==="1234"){
                console.log("Login Successful..!")
                alert("login success")
            }
            else{
                console.log("Invalid Credentials..!")
                alert("login failed")
            }
        }



    </script>
    
</body>
</html>
